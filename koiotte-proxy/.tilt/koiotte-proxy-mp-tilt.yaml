apiVersion: apps/v1
kind: Deployment
metadata:
  name: koiotte-proxy-mp
  labels:
    app: koiotte-proxy-mp
spec:
  replicas: 1
  # Recreate: /data é PVC RWO com SQLite de escritor único.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: koiotte-proxy-mp
  template:
    metadata:
      labels:
        app: koiotte-proxy-mp
    spec:
      containers:
        - name: koiotte-proxy-mp
          image: koiotte-proxy-mp-image
          env:
            - name: KOIOTTE_CONFIG
              value: /etc/koiotte/koiotte.yaml
          ports:
            - containerPort: 8080
            - containerPort: 18000
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: kp-data
              mountPath: /data
            - name: koiotte-config
              mountPath: /etc/koiotte
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
      volumes:
        - name: kp-data
          persistentVolumeClaim:
            claimName: koiotte-proxy-data
        - name: koiotte-config
          configMap:
            name: koiotte-config
---
apiVersion: v1
kind: Service
metadata:
  name: koiotte-proxy-mp-service
spec:
  type: NodePort
  selector:
    app: koiotte-proxy-mp
  ports:
    - name: api
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30180
    - name: xds
      protocol: TCP
      port: 18000
      targetPort: 18000
