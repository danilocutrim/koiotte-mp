apiVersion: apps/v1
kind: Deployment
metadata:
  name: koiotte-proxy-envoy
  labels:
    app: koiotte-proxy-envoy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: koiotte-proxy-envoy
  template:
    metadata:
      labels:
        app: koiotte-proxy-envoy
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.29-latest
          # `--concurrency` acompanha `limits.cpu` abaixo: sem ele o Envoy dimensiona os
          # workers pelos cores do NODE, e o limite do k8s é quota CFS. Ver o cabeçalho de
          # dev-local/docker/compose/docker-compose.yml para a medição que motivou isto.
          args: ["-c", "/etc/envoy/bootstrap.yaml", "--service-node", "koiotte-proxy", "--service-cluster", "koiotte-proxy", "--concurrency", "1"]
          ports:
            - containerPort: 10000
          volumeMounts:
            - name: envoy-bootstrap
              mountPath: /etc/envoy
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: envoy-bootstrap
          configMap:
            name: koiotte-proxy-envoy-bootstrap-edge
---
apiVersion: v1
kind: Service
metadata:
  name: koiotte-proxy-envoy-service
spec:
  type: NodePort
  selector:
    app: koiotte-proxy-envoy
  ports:
    - name: http
      protocol: TCP
      port: 10000
      targetPort: 10000
      nodePort: 30100
